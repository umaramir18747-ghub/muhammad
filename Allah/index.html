        :root {

            --text-arabic: #ffffff;
            --text-urdu: #e2e8f0;
            --text-english: #94a3b8;
            --border-gold: rgba(212, 175, 55, 0.4);

            margin: 0;
            padding: 0;
        }

            background-image: radial-gradient(circle at 50% 0%, #173d2d 0%, #0a1912 75%);

        }

            color: var(--accent-gold);

            font-size: 1.1rem;
            color: var(--accent-gold-light);
            letter-spacing: 1px;
            direction: ltr;
        }

        .audio-container {
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            padding: 16px 20px;
            border-radius: 0; /* Sharp square corners */
            text-align: center;
            box-shadow: var(--shadow-card);
        }

            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 600;
            direction: ltr;
        }

            margin: 0 auto 40px auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 0; /* Sharp square corners */
            border: 1px solid var(--border-gold);
            background: rgba(18, 41, 30, 0.8);
            color: #fff;
            font-size: 1rem;
            text-align: center;

        .search-container input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Responsive Grid: 3 cards per row on Desktop */
        .names-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1280px;
            margin: 0 auto;
            direction: rtl; /* Flow starts from Urdu/Right side */
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 0; /* Sharp square corners */
            padding: 24px 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .number-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-gold);
            border-radius: 0; /* Sharp square corners */
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: ltr;
        }

            font-family: 'Amiri', serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--text-arabic);
            margin: 15px 0 10px 0;
            line-height: 1.4;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.1);

            font-size: 0.95rem;
            color: var(--accent-gold-light);

            letter-spacing: 0.5px;
            margin-bottom: 12px;
            direction: ltr;

            margin: 10px 0 14px 0;

            font-size: 0.88rem;
            color: var(--text-english);
            direction: ltr;
            line-height: 1.4;

            }

                font-size: 2.4rem;
            }
            .arabic-name {

            }
        }

        function renderCards(data) {
            const grid = document.getElementById('namesGrid');
            grid.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="number-badge">${item.id}</div>
                    <div class="arabic-name">${item.arabic}</div>
                    <div class="transliteration">${item.transliteration}</div>
                    <div class="divider"></div>
                    <div class="urdu-meaning">${item.urdu}</div>
                    <div class="english-meaning">${item.english}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allahNames.filter(item => 
                item.arabic.includes(query) ||
                item.transliteration.toLowerCase().includes(query) ||
                item.urdu.includes(query) ||
                item.english.toLowerCase().includes(query) ||
                item.id.toString() === query
            );
            renderCards(filtered);
        }

        // Initial render
        renderCards(allahNames);
    </script>
