<!-- header.html - Islamic Header with Arabic Calligraphy -->
<header class="top-bar">
  <!-- First Row: Three Dua Texts with Icons -->
  <div class="top-bar-first-row">
    <!-- Right side: Icons & Ya Allah -->
    <div class="top-bar-right">
      <div class="header-icons">
        <div class="icon-btn" id="sidebarToggle" title="Toggle Sidebar">
          <i class="fas fa-bars"></i>
        </div>
      </div>
      <div class="dua-text right-dua">
        <span class="arabic-calligraphy">يَا اللَّهُ</span>
      </div>
    </div>

    <!-- Center: Mashallah -->
    <div class="top-bar-center">
      <div class="dua-text center-dua">
        <span class="arabic-calligraphy">مَاشَاءَ اللَّهُ</span>
      </div>
    </div>

    <!-- Left side: Fullscreen & Ya Muhammad SAW -->
    <div class="top-bar-left">
      <div class="dua-text left-dua">
        <span class="arabic-calligraphy">يَا مُحَمَّدُ ﷺ</span>
      </div>
      <div class="header-icons-left">
        <div class="icon-btn" id="fullscreenToggle" title="Fullscreen">
          <i class="fas fa-expand"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Second Row: Bismillah & Ta'awwuz -->
  <div class="top-bar-second-row">
    <div class="taawwuz-box">
      <span class="arabic-bismillah">أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ</span>
      
    </div>
    <div class="bismillah-box">
      <span class="arabic-bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
    </div>
  </div>
</header>
